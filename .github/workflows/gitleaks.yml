
name: Comprobacion de secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Analizar secretos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
